name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify dbt CLI
        run: dbt --version

      - name: Run tests
        run: pytest --cov=src --cov-fail-under=80 --maxfail=1 --disable-warnings -q tests/

      - name: Check formatting
        run: black --check src/ tests/ scripts/

      - name: Check linting
        run: flake8 src/ tests/

      - name: Type check
        run: pyright src/

  dbt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: hashFiles('dbt/dbt_project.yml', 'dbt_project.yml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: hashFiles('dbt/dbt_project.yml', 'dbt_project.yml') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Parse dbt project
        if: hashFiles('dbt/dbt_project.yml', 'dbt_project.yml') != ''
        run: |
          if [ -f dbt/dbt_project.yml ]; then cd dbt; fi
          dbt deps
          dbt parse
